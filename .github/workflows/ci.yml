name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, integration, API, and scenario tests
        run: python -m unittest discover -s tests
      - name: Every scenario runs end to end and the audit chain verifies
        run: python -m glcc demo --out /tmp/demo-report
      - name: Mutation check (deliberate breakages must be caught)
        if: matrix.python-version == '3.12'
        run: python scripts/mutation_check.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: /tmp/demo-report
